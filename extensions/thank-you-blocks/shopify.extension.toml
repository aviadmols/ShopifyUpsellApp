# Thank you / order status page blocks. Fetches blocks from Laravel and renders by type.
# Checkout UI דורש 2025-04 ומעלה
api_version = "2025-04"

[[extensions]]
uid = "28265bef-6b73-8ff2-b435-ff7dfe76cd4e78b69818"
type = "ui_extension"
name = "Thank You Blocks"
handle = "thank-you-blocks"

[[extensions.targeting]]
target = "purchase.thank-you.block.render"
module = "./src/ThankYou.jsx"

[extensions.capabilities]
network_access = true

[extensions.settings]
[[extensions.settings.fields]]
key = "api_url"
type = "single_line_text_field"
name = "API URL"
[[extensions.settings.fields]]
key = "extension_secret"
type = "single_line_text_field"
name = "Extension secret"
[[extensions.settings.fields]]
key = "shop_domain"
type = "single_line_text_field"
name = "Shop domain"
[[extensions.settings.fields]]
key = "block_id"
type = "single_line_text_field"
name = "Block ID (optional)"
description = "Admin block ID from Blocks. Leave empty for legacy Placement block list."
[[extensions.settings.fields]]
key = "show_debug_when_empty"
type = "boolean"
name = "Show debug info when no blocks or error"
description = "When enabled, shows BUILD_ID and status when there are no blocks or connection fails. Leave off for storefront."