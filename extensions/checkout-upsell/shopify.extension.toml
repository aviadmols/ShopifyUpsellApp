# Checkout upsell: show offers during checkout; add to cart with one click.
# Create with: shopify app generate extension -> Checkout UI, then replace with this config.
# Checkout UI requires one of: 2025-04, 2025-07, 2025-10, 2026-01, 2026-04. 2024-01 is no longer valid.
api_version = "2025-04"

[[extensions]]
uid = "42a78221-416b-44aa-07ba-7ad811835d0691422ded"
type = "ui_extension"
name = "Zyg Blocks"
handle = "checkout-upsell"

[[extensions.targeting]]
target = "purchase.checkout.block.render"
module = "./src/Checkout.jsx"

[extensions.capabilities]
network_access = true
api_access = true

[extensions.settings]
# Required: without Extension secret the block shows "Not configured" and will not call the API.
[[extensions.settings.fields]]
key = "extension_secret"
type = "single_line_text_field"
name = "Extension secret (required)"
description = "Required. Set CHECKOUT_EXTENSION_SECRET from Railway or .env. Without it the block cannot connect."
# Optional: defaults used when empty.
[[extensions.settings.fields]]
key = "api_url"
type = "single_line_text_field"
name = "API URL (optional)"
description = "Optional. Full app URL (e.g. https://….railway.app). Leave empty for default."
[[extensions.settings.fields]]
key = "shop_domain"
type = "single_line_text_field"
name = "Shop domain (optional)"
description = "Optional. Store myshopify.com domain. Leave empty for default."
[[extensions.settings.fields]]
key = "block_id"
type = "single_line_text_field"
name = "Widget ID (optional)"
description = "ID from Admin → Widgets. Use one widget per block instance (e.g. Upsell, Progress bar, or Content). Leave empty for legacy Placement."
[[extensions.settings.fields]]
key = "show_debug_when_empty"
type = "boolean"
name = "Show debug info when no offers or error"
description = "When enabled, shows BUILD_ID and connection details when the block has no offers or fails. Leave off for storefront."
