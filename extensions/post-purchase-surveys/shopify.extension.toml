# Post-purchase surveys (Shopify Plus only): show questionnaire after payment.
name = "post-purchase-surveys"
type = "checkout_post_purchase"
uid = "b2f5b5c4-0d91-4d62-8a6e-5a1b2a7f3c10"

# Required by Shopify: at least one metafield.
[[metafields]]
namespace = "zyg_surveys"
key = "post_purchase_survey_config"

[settings]
[[settings.fields]]
key = "extension_secret"
type = "single_line_text_field"
name = "Extension secret (required)"

[[settings.fields]]
key = "api_url"
type = "single_line_text_field"
name = "API URL"

[[settings.fields]]
key = "shop_domain"
type = "single_line_text_field"
name = "Shop domain"

[[settings.fields]]
key = "show_debug_when_empty"
type = "boolean"
name = "Show debug info when no survey"

