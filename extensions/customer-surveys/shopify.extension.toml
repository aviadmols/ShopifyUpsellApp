# Customer surveys: show a questionnaire on Checkout / Thank you (and optionally post-purchase via separate extension).
api_version = "2025-04"

[[extensions]]
uid = "6d3a2f5b-9f44-4b91-a2f9-7bb5b1e2c1aa"
type = "ui_extension"
name = "Customer Surveys"
handle = "customer-surveys"

[[extensions.targeting]]
target = "purchase.checkout.block.render"
module = "./src/CheckoutSurvey.jsx"

[[extensions.targeting]]
target = "purchase.thank-you.block.render"
module = "./src/ThankYouSurvey.jsx"

[extensions.capabilities]
network_access = true

[extensions.settings]
[[extensions.settings.fields]]
key = "extension_secret"
type = "single_line_text_field"
name = "Extension secret (required)"
description = "Required. Must match CHECKOUT_EXTENSION_SECRET on your backend."

[[extensions.settings.fields]]
key = "api_url"
type = "single_line_text_field"
name = "API URL (optional)"
description = "Optional. Full app URL (e.g. https://….railway.app). Leave empty for default."

[[extensions.settings.fields]]
key = "shop_domain"
type = "single_line_text_field"
name = "Shop domain (optional)"
description = "Optional. Store myshopify.com domain. Leave empty to use runtime shop when available."

[[extensions.settings.fields]]
key = "show_debug_when_empty"
type = "boolean"
name = "Show debug info when no survey"
description = "When enabled, shows build id and status if no survey matches or connection fails."

